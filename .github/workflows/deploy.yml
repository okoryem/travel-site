name: Deploy site

# Pushing to main is the deploy. Keeping them the same action is the point —
# it makes the live site and the repository structurally unable to drift.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch: # manual re-run, e.g. to pick up content changed in the API

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it to S3.
  group: deploy-site
  cancel-in-progress: true

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: installs exactly the lockfile and fails if
      # package.json and the lockfile disagree.
      - run: npm ci

      # deploy.sh doesn't lint, so without this a lint error ships. Type
      # checking is not a separate step: `next build` does it, and it has to,
      # because PageProps and LayoutProps are generated into .next/types during
      # the build. A standalone tsc run before it cannot see them.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Reads the content API and stack outputs itself; nothing is hardcoded.
      - name: Build and deploy
        run: npm run deploy

      - name: Verify the site is serving
        run: |
          url=$(aws cloudformation describe-stacks --stack-name TravelSiteStack \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          echo "checking $url"
          for path in / /films/ /clips/salkantay/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

  # Separate job: infra has its own package.json and node_modules, so it needs
  # its own install. Catches CDK type errors on push rather than at deploy time.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - name: Type check infrastructure
        run: npx tsc --noEmit
        working-directory: infra

      - name: Test infrastructure
        run: npm test
        working-directory: infra
